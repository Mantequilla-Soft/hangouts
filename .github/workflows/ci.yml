name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/sdk-core/package-lock.json
            packages/sdk-react/package-lock.json
            demo/package-lock.json
            docs-site/package-lock.json
      - name: Build sdk-core
        working-directory: packages/sdk-core
        run: npm ci && npm run build
      - name: Build sdk-react (against the local sdk-core build, like deploy.sh)
        working-directory: packages/sdk-react
        run: |
          npm ci
          rsync -a --delete ../sdk-core/dist/ ./node_modules/@snapie/hangouts-core/dist/
          npm run build
      - name: Build demo
        working-directory: demo
        run: npm ci && npx vite build
        env:
          VITE_API_URL: https://hangout-api.3speak.tv
          VITE_LIVEKIT_URL: wss://livekit.3speak.tv
      - name: Build docs
        working-directory: docs-site
        run: npm ci && npx vite build

  # Single check the auto-deployer on the box waits for (deploy/autodeploy.sh).
  ci-ok:
    needs: [server, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI jobs passed"
