# systemd drop-in for hangouts-autodeploy on live.3speak.tv
# Install: /etc/systemd/system/hangouts-autodeploy.service.d/live.conf
#
# live.3speak.tv serves the demo only as the LiveKit egress recording template
# (/egress-template/), has no docs site, and runs streams that a restart would
# hurt: never deploy while someone is live. Wait up to 4 hours for every
# LiveKit room to be empty; still busy after that, cancel that deploy.
[Service]
Environment=DEMO_BUILD=egress
Environment=DOCS_BUILD=0
Environment=QUIET_WAIT_MAX_MIN=240
Environment=LIVEKIT_HTTP=http://127.0.0.1:7880
Environment=LIVEKIT_KEYS_FILE=/opt/livekit/lk.env
